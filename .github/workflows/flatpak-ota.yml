name: Build and Deploy Flatpak OTA

on:
  push:
    tags:
      - 'v*' # Trigger otomatis tiap bikin release tag (contoh: v0.1.0)
  workflow_dispatch: # Bisa di-trigger manual lewat web

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Export to OSTree Repo
        run: |
          flatpak-builder --force-clean --repo=repo build-dir com.cobaltty.stampy.json
          flatpak build-update-repo repo

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

  deploy-pages:
    needs: build-flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
